<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" href="assets/images/favicon.png">
<title>Product — Nomad Cosmetics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=6">
</head>
<body>

<div class="page-shell">
  <header class="site-header">
    <a class="logo" href="index.html">Nomad<br>Cosmetics</a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="shop.html" class="active">Shop</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </nav>
    <div class="header-actions">
      <div class="search-box">
        <input type="text" placeholder="Search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <button aria-label="Wishlist" id="headerWishlistBtn"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7.2-4.5-9.8-9C.6 8.4 2 4.5 6 4c2.3-.3 4.3 1 6 3 1.7-2 3.7-3.3 6-3 4 .5 5.4 4.4 3.8 8-2.6 4.5-9.8 9-9.8 9Z"/></svg></button>
      <button aria-label="Bag" class="cart-btn" id="cartBtn"><svg width="18" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="cart-badge" id="cartBadge">0</span></button>
      <button aria-label="Account" id="accountBtn"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg></button>
    </div>
  </header>

  <nav class="breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a> / <a href="shop.html" id="crumbCategory">Shop</a> / <span id="crumbName">Product</span></nav>

  <section class="product" id="productDetail">
    <div class="product-gallery">
      <div class="gallery-main">
        <img id="mainImage" src="" alt="">
      </div>
      <div class="gallery-side">
        <div class="gallery-thumb hero-thumb">
          <img id="thumbImage1" src="" alt="">
        </div>
        <div class="gallery-thumb">
          <img id="thumbImage2" src="" alt="">
        </div>
      </div>
    </div>

    <div class="product-info">
      <p class="product-brand" id="productBrand">Brand</p>
      <h1 id="productName">Product Name</h1>

      <dl class="spec-list">
        <div class="spec-row spec-lead">
          <dt id="productStep">Category</dt>
          <dd id="productLead">Description</dd>
        </div>
        <div class="spec-row">
          <dt>Targets</dt>
          <dd id="productTargets"></dd>
        </div>
        <div class="spec-row">
          <dt>Suited to</dt>
          <dd id="productSuited"></dd>
        </div>
        <div class="spec-row">
          <dt>Format</dt>
          <dd id="productFormat"></dd>
        </div>
        <div class="spec-row">
          <dt>Key ingredients</dt>
          <dd id="productIngredients"></dd>
        </div>
      </dl>

      <div class="price-row">
        <span class="price" id="productPrice"></span>
        <span class="pill" id="productSize"></span>
        <span class="spacer"></span>
        <a href="#" class="link-underline">Delivery</a>
        <span class="dot">/</span>
        <a href="#" class="link-underline">Payment</a>
      </div>

      <div class="buy-row">
        <div class="qty-stepper">
          <button class="qty-btn" id="qtyMinus" aria-label="Decrease quantity">−</button>
          <span id="qtyValue">1</span>
          <button class="qty-btn" id="qtyPlus" aria-label="Increase quantity">+</button>
        </div>
        <button class="btn-cart" id="addToCartBtn">add to cart</button>
        <button class="icon-btn" id="wishlistBtn" aria-label="Add to wishlist">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7.2-4.5-9.8-9C.6 8.4 2 4.5 6 4c2.3-.3 4.3 1 6 3 1.7-2 3.7-3.3 6-3 4 .5 5.4 4.4 3.8 8-2.6 4.5-9.8 9-9.8 9Z"/></svg>
        </button>
      </div>
    </div>
  </section>

  <section class="also-like">
    <div class="also-like-head">
      <h2>You may also like:</h2>
      <div class="carousel-nav">
        <button class="carousel-arrow" id="alPrev" aria-label="Previous">←</button>
        <button class="carousel-arrow" id="alNext" aria-label="Next">→</button>
      </div>
    </div>

    <div class="product-grid" id="productGrid"></div>
  </section>

  <footer class="site-footer">
    <p>© 2026 Fynix Studios. All Rights Reserved.</p>
  </footer>
</div>

<script src="products.js?v=3"></script>
<script src="script.js?v=5"></script>
</body>
</html>
