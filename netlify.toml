[build]
  command = ""
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Caching: static assets are versioned with ?v= query strings, so a month is safe.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/portfolio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Old portfolio URLs (with spaces) now live at hyphenated paths
[[redirects]]
  from = "/portfolio/592%20hub/*"
  to = "/portfolio/592-hub/:splat"
  status = 301
