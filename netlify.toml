[build]
  command = ""
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Caching: static assets are versioned with ?v= query strings, so a month is safe.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/portfolio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Old portfolio URLs (with spaces) now live at hyphenated paths
[[redirects]]
  from = "/portfolio/guyana%20bites/*"
  to = "/portfolio/guyana-bites/:splat"
  status = 301
[[redirects]]
  from = "/portfolio/lux%20rentals/*"
  to = "/portfolio/lux-rentals/:splat"
  status = 301
[[redirects]]
  from = "/portfolio/nomad%20skincare/*"
  to = "/portfolio/nomad-skincare/:splat"
  status = 301
[[redirects]]
  from = "/portfolio/relentless%20fitness/*"
  to = "/portfolio/relentless-fitness/:splat"
  status = 301

# Projects no longer shown on the site: send every address (old and new) to the homepage portfolio.
